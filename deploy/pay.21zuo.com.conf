server {
    listen 80;
    server_name pay.21zuo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pay.21zuo.com;

    # SSL - will be replaced by Let's Encrypt via bt
    ssl_certificate /www/server/panel/vhost/cert/pay.21zuo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pay.21zuo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # H5 frontend
    location /h5/ {
        alias /opt/qgc/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }
    
    location = /h5 {
        return 301 /h5/;
    }

    # Admin frontend
    location /admin/web/ {
        alias /opt/qgc/admin/;
        index index.html;
        try_files $uri $uri/ /admin/web/index.html;
    }
    
    location = /admin/web {
        return 301 /admin/web/;
    }

    # Root redirect to H5
    location = / {
        return 302 /h5;
    }

    # 兼容旧分享链接：分享链接统一落到 H5 路由
    location ^~ /campaign/ {
        rewrite ^/campaign/(.*)$ /h5/campaign/$1 redirect;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 上传文件静态资源
    location /uploads/ {
        alias /opt/qgc/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin API proxy
    location /admin/api/ {
        proxy_pass http://127.0.0.1:8080/admin/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WeChat Pay callback proxy
    location /pay/ {
        proxy_pass http://127.0.0.1:8080/pay/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;

    access_log /www/wwwlogs/pay.21zuo.com.log;
    error_log /www/wwwlogs/pay.21zuo.com.error.log;
}
