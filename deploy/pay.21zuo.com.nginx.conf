# HTTP -> HTTPS重定向
server {
    listen 80;
    server_name pay.21zuo.com;
    
    # ACME验证路径(Let's Encrypt证书续期)
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/pay.21zuo.com;
    }
    
    # 其他请求重定向到HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS主站
server {
    listen 443 ssl http2;
    server_name pay.21zuo.com;
    
    # SSL证书(Let's Encrypt)
    ssl_certificate /www/server/panel/vhost/cert/pay.21zuo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pay.21zuo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # API反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    
    # Admin API反向代理
    location /admin/api/ {
        proxy_pass http://127.0.0.1:8080/admin/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 微信支付回调
    location /pay/ {
        proxy_pass http://127.0.0.1:8080/pay/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # H5前端
    location /h5 {
        alias /opt/qgc/h5;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }
    
    # Admin前端
    location /admin/web {
        alias /opt/qgc/admin;
        index index.html;
        try_files $uri $uri/ /admin/web/index.html;
    }
    
    # 根路径重定向到H5
    location = / {
        return 302 /h5;
    }
    
    access_log /www/wwwlogs/pay.21zuo.com.log;
    error_log /www/wwwlogs/pay.21zuo.com.error.log;
}