version: '3.8'

services:
  mysql:
    image: mysql:5.6
    container_name: qgc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiongguichou_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qiongguichou}
      MYSQL_USER: ${MYSQL_USER:-qiongguichou}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qiongguichou_pass_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qgc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-qgc_redis_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qgc_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qgc-server:
    build:
      context: ../qgc-server
      dockerfile: Dockerfile
    container_name: qgc-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-qiongguichou}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-qiongguichou}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-qiongguichou_pass_2024}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-qgc_redis_2024}
      JWT_SECRET: ${JWT_SECRET:-qiongguichou2026secretkey_dev_only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: qgc-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../qgc-h5/dist:/usr/share/nginx/html/h5:ro
      - ../qgc-admin-web/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - qgc-server

volumes:
  mysql_data:
  redis_data: