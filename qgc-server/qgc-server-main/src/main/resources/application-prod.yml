# 生产环境配置
# 生产环境严禁开启Mock模式

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qiongguichou?useUnicode=true&characterEncoding=utf8mb4&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

qgc:
  auth:
    mock-enabled: false  # 生产环境禁止Mock登录
  wechat:
    mock-enabled: false  # 生产环境禁止Mock微信
  pay:
    mock-enabled: false  # 生产环境禁止Mock支付

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.qiongguichou: info
    com.baomidou.mybatisplus: warn