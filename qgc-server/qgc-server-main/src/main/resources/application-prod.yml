# 生产环境配置 - 覆盖开发默认值
# 激活方式: --spring.profiles.active=prod

qgc:
  auth:
    mock-enabled: false
  wechat:
    mock-enabled: false
  pay:
    mock-enabled: false
    platform-public-key-path: ${WX_PAY_PLATFORM_PUBLIC_KEY_PATH:}
    platform-public-key-id: ${WX_PAY_PLATFORM_PUBLIC_KEY_ID:}

# 生产日志级别
logging:
  level:
    com.qiongguichou: info

# 生产环境禁用SQL输出
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 生产环境禁用Swagger
springfox:
  documentation:
    enabled: false
