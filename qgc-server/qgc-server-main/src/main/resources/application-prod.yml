# 生产环境配置
# 生产环境严禁开启Mock模式

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qiongguichou?useUnicode=true&characterEncoding=utf8mb4&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}

# CORS - 生产环境必须配置具体域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

qgc:
  jwt:
    secret: ${JWT_SECRET}  # 生产环境必须设置，无默认值
  auth:
    mock-enabled: false  # 生产环境禁止Mock登录
  wechat:
    mock-enabled: false  # 生产环境禁止Mock微信
    mp:
      appId: ${WX_MP_APPID}
      secret: ${WX_MP_SECRET}
      token: ${WX_MP_TOKEN}
      aesKey: ${WX_MP_AES_KEY}
  pay:
    mock-enabled: false  # 生产环境禁止Mock支付
    appId: ${WX_PAY_APPID}
    mchId: ${WX_PAY_MCH_ID}
    mchKey: ${WX_PAY_MCH_KEY}
    notifyUrl: ${WX_PAY_NOTIFY_URL}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.qiongguichou: info
    com.baomidou.mybatisplus: warn