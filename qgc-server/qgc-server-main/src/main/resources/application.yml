server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: qiongguichou
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qiongguichou?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.qiongguichou.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
qgc:
  jwt:
    secret: qiongguichou2026secretkey
    user-expiration: 604800000  # 7天(毫秒)
    admin-expiration: 86400000  # 1天(毫秒)

  # 认证配置
  auth:
    mock-enabled: true  # 开发模式: 允许Mock登录

  # 文件上传配置
  upload:
    path: ./uploads/
    max-size: 5242880  # 5MB

  # 微信配置
  wechat:
    mock-enabled: true  # Mock模式: 不依赖真实微信API
    mp:
      appId: wx_mock_appid
      secret: mock_secret
      token: mock_token
      aesKey: mock_aes_key

  # 微信支付配置
  pay:
    mock-enabled: true  # Mock模式: 不依赖真实微信支付
    appId: wx_mock_appid
    mchId: mock_mch_id
    mchKey: mock_mch_key
    notifyUrl: http://localhost:8080/api/pay/notify

# Swagger配置
springfox:
  documentation:
    enabled: true
    swagger-ui:
      enabled: true

# 日志配置
logging:
  level:
    com.qiongguichou: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"