server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: qiongguichou
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qiongguichou?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.qiongguichou.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# CORS配置
cors:
  allowed-origins: http://localhost:8080,http://localhost:3000

# JWT配置
qgc:
  jwt:
    secret: ${JWT_SECRET:qiongguichou2026secretkey}
    user-expiration: 604800000  # 7天(毫秒)
    admin-expiration: 86400000  # 1天(毫秒)

  # 认证配置
  auth:
    mock-enabled: ${QGC_AUTH_MOCK:true}  # 生产环境必须设为false

  # 文件上传配置
  upload:
    path: ${QGC_UPLOAD_PATH:./uploads/}
    max-size: 5242880  # 5MB

  # 微信配置
  wechat:
    mock-enabled: ${QGC_WECHAT_MOCK:true}  # 生产环境必须设为false
    callback-base-url: ${QGC_WECHAT_CALLBACK_BASE_URL:}
    allowed-domains: ${QGC_WECHAT_ALLOWED_DOMAINS:}
    mp:
      appId: ${WX_MP_APPID:wx_mock_appid}
      secret: ${WX_MP_SECRET:mock_secret}
      token: ${WX_MP_TOKEN:mock_token}
      aesKey: ${WX_MP_AES_KEY:mock_aes_key}

  # 微信支付配置
  pay:
    mock-enabled: ${QGC_PAY_MOCK:true}  # 生产环境必须设为false
    appId: ${WX_PAY_APPID:wx_mock_appid}
    mchId: ${WX_PAY_MCH_ID:mock_mch_id}
    mchKey: ${WX_PAY_MCH_KEY:mock_mch_key}
    apiV3Key: ${WX_PAY_API_V3_KEY:}
    privateKeyPath: ${WX_PAY_PRIVATE_KEY_PATH:}
    certificateSerialNo: ${WX_PAY_CERTIFICATE_SERIAL_NO:}
    certPath: ${WX_PAY_CERT_PATH:}
    notifyUrl: ${WX_PAY_NOTIFY_URL:http://localhost:8080/api/pay/notify}
    refundNotifyUrl: ${WX_PAY_REFUND_NOTIFY_URL:}

# Swagger配置
springfox:
  documentation:
    enabled: true
    swagger-ui:
      enabled: true

# 日志配置
logging:
  level:
    com.qiongguichou: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"